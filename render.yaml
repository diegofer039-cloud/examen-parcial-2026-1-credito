services:
  - type: web
    name: credito-plataforma
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        value: "DataSource=/app/app.db;Cache=Shared"
      - key: Redis__ConnectionString
        sync: false
      - key: RabbitMq__ConnectionString
        sync: false
      - key: RabbitMq__QueueName
        value: solicitudes.notificaciones
      - key: RabbitMq__ConsumerEnabled
        value: "true"
      - key: RabbitMq__PrefetchCount
        value: "10"