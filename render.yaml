services:
  - type: web
    name: credito-plataforma
    runtime: dotnet
    plan: free
    buildCommand: "dotnet CreditoPlataforma.csproj --configuration Release"
    # $PORT se expande en el shell del start command; no confiar en ${PORT} dentro de una variable de entorno.
    startCommand: 'ASPNETCORE_URLS="http://0.0.0.0:$PORT" dotnet bin/Release/net10.0/CreditoPlataforma.dll'
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        value: "DataSource=/var/data/app.db;Cache=Shared"
      - key: Redis__ConnectionString
        sync: false
      - key: RabbitMq__ConnectionString
        sync: false
      - key: RabbitMq__QueueName
        value: solicitudes.notificaciones
      - key: RabbitMq__ConsumerEnabled
        value: "true"
      - key: RabbitMq__PrefetchCount
        value: "10"
    disk:
      name: credito-sqlite
      mountPath: /var/data
      sizeGB: 1
